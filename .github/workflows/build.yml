name: Build MystryxLauncher
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller Pillow
          brew install create-dmg

      - name: Convert ICO to ICNS
        run: |
          python3 - <<'EOF'
          from PIL import Image
          img = Image.open("branding.ico")
          frames = []
          try:
              while True:
                  frames.append((img.size, img.copy()))
                  img.seek(img.tell() + 1)
          except EOFError:
              pass
          best_frame = max(frames, key=lambda x: x[0][0])[1] if frames else img
          best_frame = best_frame.convert("RGBA")
          best_frame.save("branding_source.png")
          EOF

          mkdir -p branding.iconset
          sips -z 16 16     branding_source.png --out branding.iconset/icon_16x16.png
          sips -z 32 32     branding_source.png --out branding.iconset/icon_16x16@2x.png
          sips -z 32 32     branding_source.png --out branding.iconset/icon_32x32.png
          sips -z 64 64     branding_source.png --out branding.iconset/icon_32x32@2x.png
          sips -z 128 128   branding_source.png --out branding.iconset/icon_128x128.png
          sips -z 256 256   branding_source.png --out branding.iconset/icon_128x128@2x.png
          sips -z 256 256   branding_source.png --out branding.iconset/icon_256x256.png
          sips -z 512 512   branding_source.png --out branding.iconset/icon_256x256@2x.png
          sips -z 512 512   branding_source.png --out branding.iconset/icon_512x512.png
          sips -z 1024 1024 branding_source.png --out branding.iconset/icon_512x512@2x.png
          iconutil -c icns branding.iconset -o branding.icns

      - name: Install universal Python dependencies
        run: |
          pip install --upgrade pip
          arch -x86_64 pip install pyinstaller Pillow
          pip install pyinstaller Pillow

      - name: Build Universal APP
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed \
            --icon=branding.icns \
            --add-data "branding.ico:." \
            --target-arch universal2 \
            main.py
          mv dist/main dist/MystryxLauncher.app 2>/dev/null || mv "dist/main.app" "dist/MystryxLauncher.app" 2>/dev/null || true

      - name: Sign APP (ad-hoc)
        run: |
          codesign --force --deep --sign - "dist/MystryxLauncher.app"

      - name: Build DMG
        run: |
          create-dmg \
            --volname "MystryxLauncher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 185 \
            "MystryxLauncher.dmg" \
            "dist/"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: MystryxLauncher-macOS
          path: MystryxLauncher.dmg